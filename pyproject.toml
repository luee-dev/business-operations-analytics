[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-operations-analytics"
version = "0.1.0"
description = "End-to-end business operations analytics platform"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "numpy",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "openpyxl",
    "reportlab",
    "scipy",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

