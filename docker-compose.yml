
services:
  postgres:
    image: postgres:16
    container_name: boa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: business_analytics
      POSTGRES_USER: boa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boa_user -d business_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: